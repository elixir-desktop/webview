# Input mapping: each case is a host process invocation (no GUI).
# Implementations MUST cover these in test/e2e/ (tag :e2e).
# Start a single-instance host, connect Transport, then oneshot --edw-rpc.

edw_rpc:
  - name: "inspects 1+1 as 2"
    input:
      expr: "1+1"
      host: running_single_instance
    output:
      stdout_inspect: "2"
      exit: 0

  - name: "evaluates a module on the connected client"
    input:
      expr: "DesktopWebview.Binary.available?()"
      host: running_single_instance
    output:
      stdout_inspect: "true"
      exit: 0

  - name: "fails when no single-instance host is running"
    input:
      expr: "1+1"
      host: none
    output:
      exit_nonzero: true

  - name: "rejects --edw-rpc together with --edw-recover"
    input:
      flags: ["--edw-rpc", "1+1", "--edw-recover"]
    output:
      exit_nonzero: true
      no_listening: true
