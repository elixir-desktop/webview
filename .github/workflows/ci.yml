name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  elixir:
    name: Elixir unit
    runs-on: ubuntu-latest
    env:
      NO_WX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.18"
      - name: Checkout desktop (path dep)
        uses: actions/checkout@v4
        with:
          repository: elixir-desktop/desktop
          path: desktop
      - run: mix deps.get
      - run: mix test --exclude e2e

  macos-e2e:
    name: macOS host + E2E
    runs-on: macos-latest
    env:
      NO_WX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.18"
      - name: Checkout desktop (path dep)
        uses: actions/checkout@v4
        with:
          repository: elixir-desktop/desktop
          path: desktop
      - name: Build host
        run: ./scripts/build_macos.sh
      - name: Ad-hoc sign
        run: codesign -s - --force --deep priv/native/macos/DesktopWebView || true
      - run: mix deps.get
      - run: mix test
        env:
          DESKTOP_WEBVIEW_BINARY: ${{ github.workspace }}/priv/native/macos/DesktopWebView

  linux-e2e:
    name: Linux host + E2E
    runs-on: ubuntu-latest
    env:
      NO_WX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.18"
      - name: Checkout desktop (path dep)
        uses: actions/checkout@v4
        with:
          repository: elixir-desktop/desktop
          path: desktop
      - name: Install GTK / WebKitGTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libnotify-dev libjson-glib-dev \
            xvfb dbus-x11
      - name: Build host
        run: ./scripts/build_linux.sh
      - run: mix deps.get
      - name: E2E under Xvfb
        run: dbus-run-session -- xvfb-run -a mix test
        env:
          DESKTOP_WEBVIEW_BINARY: ${{ github.workspace }}/priv/native/linux/DesktopWebView
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
